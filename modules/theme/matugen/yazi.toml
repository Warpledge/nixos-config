[app]
overall = { bg = "{{colors.background.default.hex}}" }

[mgr]
cwd = { fg = "{{dank16.color14.default.hex}}" }

find_keyword  = { fg = "{{dank16.color3.default.hex}}", italic = true }
find_position = { fg = "{{dank16.color13.default.hex}}", bg = "reset", italic = true }

marker_copied   = { fg = "{{dank16.color2.default.hex}}", bg = "{{dank16.color2.default.hex}}" }
marker_cut      = { fg = "{{dank16.color1.default.hex}}", bg = "{{dank16.color1.default.hex}}" }
marker_marked   = { fg = "{{dank16.color14.default.hex}}", bg = "{{dank16.color14.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

count_copied   = { fg = "{{colors.background.default.hex}}", bg = "{{dank16.color2.default.hex}}" }
count_cut      = { fg = "{{colors.background.default.hex}}", bg = "{{dank16.color1.default.hex}}" }
count_selected = { fg = "{{colors.background.default.hex}}", bg = "{{colors.primary.default.hex}}" }

border_symbol = "│"
border_style  = { fg = "{{colors.outline.default.hex}}" }


[tabs]
active   = { fg = "{{colors.background.default.hex}}", bg = "{{colors.on_surface.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.background.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}"}

select_main = { fg = "{{colors.background.default.hex}}", bg = "{{dank16.color2.default.hex}}", bold = true }
select_alt  = { fg = "{{dank16.color2.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}"}

unset_main  = { fg = "{{colors.background.default.hex}}", bg = "{{dank16.color9.default.hex}}", bold = true }
unset_alt   = { fg = "{{dank16.color9.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}"}

[indicator]
parent = { fg = "{{colors.background.default.hex}}", bg = "{{colors.on_surface.default.hex}}" }
current = { fg = "{{colors.background.default.hex}}", bg = "{{colors.primary.default.hex}}" }
preview = { fg = "{{colors.background.default.hex}}", bg = "{{colors.on_surface.default.hex}}" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "{{dank16.color2.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }
progress_error  = { fg = "{{dank16.color3.default.hex}}", bg = "{{dank16.color1.default.hex}}" }

perm_type  = { fg = "{{dank16.color4.default.hex}}" }
perm_read  = { fg = "{{dank16.color3.default.hex}}" }
perm_write = { fg = "{{dank16.color1.default.hex}}" }
perm_exec  = { fg = "{{dank16.color2.default.hex}}" }
perm_sep   = { fg = "{{colors.outline.default.hex}}" }

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = {}
value    = {}
selected = { reversed = true }

[pick]
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{dank16.color13.default.hex}}" }
inactive = {}

[confirm]
border     = { fg = "{{colors.primary.default.hex}}" }
title      = { fg = "{{colors.primary.default.hex}}" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}

[cmp]
border = { fg = "{{colors.primary.default.hex}}" }

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = {}
hovered = { fg = "{{dank16.color13.default.hex}}", bold = true }

[which]
border          = { fg = "{{colors.primary.default.hex}}" }
mask            = {}
cand            = { fg = "{{dank16.color14.default.hex}}" }
rest            = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc            = { fg = "{{dank16.color13.default.hex}}" }
separator       = "  "
separator_style = { fg = "{{colors.outline.default.hex}}" }

[help]
border  = { fg = "{{colors.primary.default.hex}}" }
chord   = { fg = "{{dank16.color14.default.hex}}" }
action  = { fg = "{{colors.on_surface_variant.default.hex}}" }
hovered = { bg = "{{colors.outline.default.hex}}", bold = true }

[notify]
title_info  = { fg = "{{dank16.color14.default.hex}}" }
title_warn  = { fg = "{{dank16.color3.default.hex}}" }
title_error = { fg = "{{dank16.color1.default.hex}}" }

[filetype]
rules = [
	# Media
	{ mime = "**/image/*", fg = "{{dank16.color3.default.hex}}" },
	{ mime = "**/{audio,video}/*", fg = "{{dank16.color13.default.hex}}" },

	# Archives
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{dank16.color1.default.hex}}" },

	# Documents
	{ mime = "**/application/{pdf,doc,rtf}", fg = "{{dank16.color14.default.hex}}" },

	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "{{colors.surface_container_highest.default.hex}}" },

	# Special file
	{ url = "*", is = "orphan", bg = "{{dank16.color1.default.hex}}" },
	{ url = "*", is = "exec"  , fg = "{{dank16.color2.default.hex}}" },

	# Dummy file
	{ url = "*", is = "dummy", bg = "{{dank16.color1.default.hex}}" },
	{ url = "*/", is = "dummy", bg = "{{dank16.color1.default.hex}}" },

	# Fallback
	{ url = "*/", fg = "{{colors.primary.default.hex}}" },
]

[spot]
border = { fg = "{{colors.primary.default.hex}}" }
title  = { fg = "{{colors.primary.default.hex}}" }
tbl_cell = { fg = "{{colors.primary.default.hex}}", reversed = true }
tbl_col = { bold = true }

[icon]
dirs = [
	{ name = ".config", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = ".git", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = ".github", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = ".npm", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = "Desktop", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = "Development", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = "Documents", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = "Downloads", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = "Library", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = "Movies", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = "Music", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = "Pictures", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = "Public", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = "Videos", text = "", fg = "{{colors.primary.default.hex}}" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "{{colors.on_surface.default.hex}}" },
	{ if = "link", text = "", fg = "{{colors.on_surface_variant.default.hex}}" },
	{ if = "block", text = "", fg = "{{dank16.color3.default.hex}}" },
	{ if = "char", text = "", fg = "{{dank16.color3.default.hex}}" },
	{ if = "fifo", text = "", fg = "{{dank16.color3.default.hex}}" },
	{ if = "sock", text = "", fg = "{{dank16.color3.default.hex}}" },
	{ if = "sticky", text = "", fg = "{{dank16.color3.default.hex}}" },
	{ if = "dummy", text = "", fg = "{{dank16.color1.default.hex}}" },

	# Fallback
	{ if = "dir", text = "", fg = "{{colors.primary.default.hex}}" },
	{ if = "exec", text = "", fg = "{{dank16.color2.default.hex}}" },
	{ if = "!dir", text = "", fg = "{{colors.on_surface.default.hex}}" },
]
