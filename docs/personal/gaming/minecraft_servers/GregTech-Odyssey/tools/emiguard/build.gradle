// EMI recipe guard for GTO; build.py runs this with -Pemi_jar=<GTO's EMI fork jar>.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = 'warpledge.emiguard'
base.archivesName = 'emiguard'

// GTO's EMI fork is compiled for Java 21 (class version 65).
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Only EMI's API and EmiStackList are used, no Minecraft methods, so the
    // fork's SRG-named jar compiles as is.
    compileOnly files(project.property('emi_jar'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    finalizedBy 'reobfJar'
}
