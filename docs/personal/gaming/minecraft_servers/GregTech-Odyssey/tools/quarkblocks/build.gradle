// Quark's structure blocks as their own mod for GTO; build.py runs this. The
// resources come from gen.py into src/generated/resources, never the repo.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = 'warpledge.quarkblocks'
base.archivesName = 'quarkblocks'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    // `gradle runServer`: a bare Forge server with only this mod, to catch load crashes.
    runs {
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { quarkblocks { source sourceSets.main } }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    finalizedBy 'reobfJar'
}
